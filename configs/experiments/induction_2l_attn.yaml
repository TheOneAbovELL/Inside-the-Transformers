# PRINCIPAL RESEARCH MODEL. 2-layer attention-only transformer on variable-offset repeated
# sequences. Hypothesis under test (configs/hypotheses/induction_2l.yaml): it solves the task with
# a previous-token head (layer 0) K-composing with an induction head (layer 1).
# Positional scheme: ALiBi. With learned absolute positions the same model got stuck at ~35-42%
# val accuracy using a positional-offset shortcut and never formed a previous-token head (see
# docs/findings.md and configs/experiments/induction_2l_learnedpos.yaml).
# Runtime on the reference laptop: ~2-5 minutes on CPU (depends on background load).
name: induction_2l_attn
seed: 0
model: {d_model: 64, n_layers: 2, n_heads: 4, attn_only: true, norm: pre, positional: alibi}
task:
  name: induction_repeat
  params: {n_symbols: 48, seq_len: 40, min_len: 6, max_len: 16}
train:
  steps: 3000
  batch_size: 64
  lr: 1.0e-3
  warmup_steps: 100
  schedule: cosine
  weight_decay: 0.01
  grad_clip: 1.0
  eval_every: 250
  eval_size: 512
  log_every: 50
  checkpoint_every: 500
  checkpoint_steps: [0, 50, 100, 150, 200, 250, 300, 400, 500, 650, 800, 1000, 1250, 1500, 2000, 2500, 3000]
  num_threads: 2
